# ==============================================================
# 评分表（Rubric）：知识图谱能力
# --------------------------------------------------------------
# 这个维度跟其他维度的最大区别是：它有很大一部分可以「精确判定」。
#
# 三元组抽取的对错是可以逐条比对的 —— 主语、关系、宾语三者都对才算对。
# 所以这一层交给 metrics/kg_metrics.py 算精确率/召回率/F1，
# 裁判只负责规则覆盖不到的部分（关系表述是否精确、多跳链是否有依据）。
#
# 能用确定性方式判定的，就不要交给裁判。这是全项目的统一原则。
# ==============================================================

id: knowledge_graph
name: 知识图谱能力
version: "1.0"

dimensions:
  - knowledge_graph

scale:
  type: ordinal
  min: 1
  max: 5
  anchors:
    5: 三元组方向与关系类型全部正确，多跳推理链完整，无编造节点或关系
    4: 三元组基本正确，有 1 处关系表述不够精确但不影响语义
    3: 有 2-3 处实体或关系错误，或多跳链漏掉了一跳
    2: 多处错误，图谱结构不成立
    1: 主体错误，或存在大量编造的三元组

criterion: |
  评估结构化知识的抽取与推理能力，分三个层面：

    1. 抽取准确性 —— 三元组的主语、谓语、宾语是否与材料一致，方向不能反
    2. 关系类型   —— 「属于」与「包含于」方向相反，不能混用；
                      「位于」与「邻近」语义不同，不能模糊替代
    3. 多跳推理   —— 推理链的每一跳都要有材料支撑，不许跳步或凭空补全

  严禁因为输出格式漂亮、三元组数量多就给高分。
  编造出来的三元组是负分项，不是加分项。

evaluation_steps:
  - 抽取回答中的全部三元组，写成 (主语, 关系, 宾语)
  - 与题目给出的 gold 三元组逐条比对，注意关系方向与关系类型
  - 若题目要求多跳推理，核对推理链的每一跳是否都有材料支撑
  - 标出「材料中找不到依据」的编造三元组
  - 按 anchors 给出分数

# 机器可判定的部分，由 metrics/kg_metrics.py 实现
deterministic_constraints:
  - type: triple_f1
    desc: 与 gold 三元组集合比对，主语/关系/宾语三者全对才算命中，输出 P / R / F1
  - type: path_match
    desc: 多跳推理路径与 gold 路径逐跳比对
  - type: json_schema
    desc: 若题目要求结构化输出，校验 JSON 与必需字段

output_schema:
  triples: array
  correct_triples: integer
  hallucinated_triples: integer
  missing_triples: integer
  score: integer
  reasoning: string

bias_controls:
  - id: quantity_over_quality
    note: 标准里显式声明「数量不构成加分理由，编造项是负分」
  - id: direction
    note: 要求裁判显式检查关系方向，方向反了必须判错
